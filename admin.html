<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PERSIAN STARK | Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#070a10;
  color:#fff;
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#0d121d;
  border-bottom:1px solid #202b3d;
  padding:15px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  color:#00e5ff;
  font-size:21px;
  font-weight:900;
}

.admin-info{
  color:#9ba7b8;
  font-size:12px;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.card{
  background:#0e141f;
  border:1px solid #202b3d;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
}

h2{
  font-size:19px;
  margin-bottom:16px;
}

h3{
  margin-bottom:8px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #2b374b;
  background:#080c13;
  color:#fff;
  outline:none;
  font-family:inherit;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#00e5ff;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#00e5ff;
  color:#001014;
}

.danger{
  background:#ff315f;
  color:#fff;
}

.secondary{
  background:#273246;
  color:#fff;
}

.hidden{
  display:none!important;
}

.status{
  background:#080c13;
  border:1px solid #202b3d;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
  color:#aeb8c7;
  font-size:13px;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  margin:5px 0 15px;
  display:none;
}

.posts-list{
  display:grid;
  gap:14px;
}

.post{
  background:#080c13;
  border:1px solid #202b3d;
  border-radius:14px;
  overflow:hidden;
}

.post-image{
  width:100%;
  max-height:260px;
  object-fit:cover;
  display:block;
}

.post-body{
  padding:15px;
}

.post-title{
  font-size:17px;
  margin-bottom:8px;
}

.post-meta{
  color:#8491a5;
  font-size:12px;
  margin-bottom:10px;
}

.post-description{
  color:#aeb8c7;
  font-size:13px;
  line-height:1.8;
  margin-bottom:14px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.actions button{
  flex:1;
  min-width:100px;
}

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.count{
  color:#7e8da4;
  font-size:13px;
}

@media(max-width:600px){

  .container{
    padding:12px;
  }

  .card{
    padding:14px;
  }

  .logo{
    font-size:17px;
  }

  .actions{
    flex-direction:column;
  }

  .actions button{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">PERSIAN STARK</div>
    <div class="admin-info" id="adminInfo">
      در حال بررسی...
    </div>
  </div>
</header>


<div class="container">


<!-- LOGIN -->

<div class="card" id="loginBox">

  <h2>🔐 ورود به پنل مدیریت</h2>

  <input
    type="email"
    id="email"
    placeholder="ایمیل"
  >

  <input
    type="password"
    id="password"
    placeholder="رمز عبور"
  >

  <button class="primary" onclick="login()">
    ورود
  </button>

  <div class="status" id="loginStatus"></div>

</div>


<!-- ADMIN -->

<div id="adminPanel" class="hidden">


<!-- ADD / EDIT -->

<div class="card">

  <div class="top-actions">

    <h2 id="formTitle">
      ➕ افزودن مطلب جدید
    </h2>

    <button
      class="secondary hidden"
      id="cancelEditBtn"
      onclick="cancelEdit()"
    >
      لغو ویرایش
    </button>

  </div>


  <input
    type="text"
    id="title"
    placeholder="عنوان مطلب"
  >


  <select id="category">

    <option value="news">
      📰 خبر
    </option>

    <option value="game">
      🎮 معرفی بازی
    </option>

    <option value="software">
      💾 نرم‌افزار
    </option>

  </select>


  <input
    type="text"
    id="description"
    placeholder="توضیح کوتاه"
  >


  <textarea
    id="content"
    placeholder="متن کامل مطلب"
  ></textarea>


  <input
    type="url"
    id="downloadUrl"
    placeholder="لینک دانلود - اختیاری"
  >


  <label style="display:block;margin-bottom:8px">
    🖼️ تصویر مطلب
  </label>


  <input
    type="file"
    id="imageFile"
    accept="image/*"
    onchange="previewImage()"
  >


  <img
    id="preview"
    class="preview"
  >


  <button
    class="primary"
    id="submitBtn"
    onclick="savePost()"
  >
    🚀 انتشار مطلب
  </button>


  <div
    class="status"
    id="postStatus"
  ></div>

</div>


<!-- POSTS -->

<div class="card">

  <div class="top-actions">

    <h2>📚 مطالب سایت</h2>

    <span
      class="count"
      id="postCount"
    >
      0 مطلب
    </span>

  </div>


  <div
    class="posts-list"
    id="postsList"
  >
    در حال بارگذاری...
  </div>

</div>


<!-- LOGOUT -->

<div style="text-align:center;margin-bottom:30px">

  <button
    class="danger"
    onclick="logout()"
  >
    🚪 خروج از حساب
  </button>

</div>


</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jmdoxofcyoxdrtxvvuiu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NqGaaVTBkzHUdCsWyWLXSA_dBqD_Q74";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let editingId = null;


// ===============================
// CHECK ADMIN
// ===============================

async function checkAdmin(){

  const result =
    await supabaseClient.auth.getUser();

  const user =
    result.data.user;


  if(!user){

    showLogin();

    return;

  }


  const profileResult =
    await supabaseClient
      .from("profiles")
      .select("username,is_admin")
      .eq("id",user.id)
      .single();


  const profile =
    profileResult.data;


  if(
    profileResult.error ||
    !profile ||
    profile.is_admin !== true
  ){

    showLogin();

    document.getElementById("loginStatus").innerText =
      "این حساب دسترسی ادمین ندارد.";

    return;

  }


  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("adminPanel")
    .classList.remove("hidden");


  document.getElementById("adminInfo").innerText =
    "ادمین: " +
    (profile.username || user.email);


  loadPosts();

}


// ===============================
// SHOW LOGIN
// ===============================

function showLogin(){

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("adminPanel")
    .classList.add("hidden");

  document.getElementById("adminInfo").innerText =
    "وارد نشده";

}


// ===============================
// LOGIN
// ===============================

async function login(){

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;


  const status =
    document.getElementById("loginStatus");


  if(!email || !password){

    status.innerText =
      "ایمیل و رمز عبور را وارد کن.";

    return;

  }


  status.innerText =
    "در حال ورود...";


  const result =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


  if(result.error){

    status.innerText =
      result.error.message;

    return;

  }


  status.innerText =
    "ورود موفق بود.";


  await checkAdmin();

}


// ===============================
// LOGOUT
// ===============================

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


// ===============================
// IMAGE PREVIEW
// ===============================

function previewImage(){

  const file =
    document.getElementById("imageFile")
      .files[0];

  const preview =
    document.getElementById("preview");


  if(!file){

    preview.src = "";
    preview.style.display = "none";

    return;

  }


  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

}


// ===============================
// SAVE POST
// ADD OR UPDATE
// ===============================

async function savePost(){

  const title =
    document.getElementById("title")
      .value
      .trim();

  const category =
    document.getElementById("category")
      .value;

  const description =
    document.getElementById("description")
      .value
      .trim();

  const content =
    document.getElementById("content")
      .value
      .trim();

  const downloadUrl =
    document.getElementById("downloadUrl")
      .value
      .trim();

  const file =
    document.getElementById("imageFile")
      .files[0];

  const status =
    document.getElementById("postStatus");


  if(!title){

    status.innerText =
      "عنوان مطلب را وارد کن.";

    return;

  }


  status.innerText =
    editingId
    ? "در حال ذخیره تغییرات..."
    : "در حال انتشار...";


  let imageUrl = null;


  // -------------------------
  // NEW IMAGE
  // -------------------------

  if(file){

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "." +
      extension;


    const upload =
      await supabaseClient
        .storage
        .from("images")
        .upload(
          fileName,
          file
        );


    if(upload.error){

      status.innerText =
        "خطا در آپلود عکس: " +
        upload.error.message;

      return;

    }


    const publicResult =
      supabaseClient
        .storage
        .from("images")
        .getPublicUrl(fileName);


    imageUrl =
      publicResult.data.publicUrl;

  }


  // =========================
  // UPDATE
  // =========================

  if(editingId){

    const updateData = {

      title:title,

      category:category,

      description:description,

      content:content,

      download_url:
        downloadUrl || null

    };


    if(imageUrl){

      updateData.image_url =
        imageUrl;

    }


    const result =
      await supabaseClient
        .from("posts")
        .update(updateData)
        .eq("id",editingId);


    if(result.error){

      status.innerText =
        "خطا در ویرایش: " +
        result.error.message;

      return;

    }


    status.innerText =
      "✅ مطلب با موفقیت ویرایش شد.";

  }


  // =========================
  // INSERT
  // =========================

  else{

    const result =
      await supabaseClient
        .from("posts")
        .insert({

          title:title,

          category:category,

          description:description,

          content:content,

          image_url:imageUrl,

          download_url:
            downloadUrl || null

        });


    if(result.error){

      status.innerText =
        "خطا در انتشار: " +
        result.error.message;

      return;

    }


    status.innerText =
      "✅ مطلب با موفقیت منتشر شد.";

  }


  resetForm();

  loadPosts();

}


// ===============================
// LOAD POSTS
// ===============================

async function loadPosts(){

  const container =
    document.getElementById("postsList");


  container.innerHTML =
    "در حال بارگذاری...";


  const result =
    await supabaseClient
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(result.error){

    container.innerHTML =
      "خطا: " +
      escapeHtml(
        result.error.message
      );

    return;

  }


  const posts =
    result.data || [];


  document.getElementById("postCount")
    .innerText =
      posts.length + " مطلب";


  if(posts.length === 0){

    container.innerHTML =
      "هنوز مطلبی وجود ندارد.";

    return;

  }


  container.innerHTML =
    posts.map(post => {

      const image =
        post.image_url
        ? `
          <img
            class="post-image"
            src="${escapeAttr(post.image_url)}"
            alt=""
          >
        `
        : "";


      return `

        <article class="post">

          ${image}

          <div class="post-body">

            <div class="post-title">
              ${escapeHtml(post.title)}
            </div>

            <div class="post-meta">
              دسته:
              ${escapeHtml(post.category)}
            </div>

            <div class="post-description">
              ${escapeHtml(
                post.description || ""
              )}
            </div>

            <div class="actions">

              <button
                class="secondary"
                onclick="editPost(${post.id})"
              >
                ✏️ ویرایش
              </button>

              <button
                class="danger"
                onclick="deletePost(${post.id})"
              >
                🗑️ حذف
              </button>

            </div>

          </div>

        </article>

      `;

    }).join("");

}


// ===============================
// EDIT POST
// ===============================

async function editPost(id){

  const result =
    await supabaseClient
      .from("posts")
      .select("*")
      .eq("id",id)
      .single();


  if(result.error){

    alert(
      "خطا در دریافت مطلب: " +
      result.error.message
    );

    return;

  }


  const post =
    result.data;


  editingId =
    id;


  document.getElementById("title")
    .value =
      post.title || "";


  document.getElementById("category")
    .value =
      post.category || "news";


  document.getElementById("description")
    .value =
      post.description || "";


  document.getElementById("content")
    .value =
      post.content || "";


  document.getElementById("downloadUrl")
    .value =
      post.download_url || "";


  document.getElementById("formTitle")
    .innerText =
      "✏️ ویرایش مطلب";


  document.getElementById("submitBtn")
    .innerText =
      "💾 ذخیره تغییرات";


  document.getElementById("cancelEditBtn")
    .classList.remove("hidden");


  const preview =
    document.getElementById("preview");


  if(post.image_url){

    preview.src =
      post.image_url;

    preview.style.display =
      "block";

  }
  else{

    preview.style.display =
      "none";

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


// ===============================
// DELETE POST
// ===============================

async function deletePost(id){

  const confirmed =
    confirm(
      "آیا مطمئنی می‌خواهی این مطلب حذف شود؟"
    );


  if(!confirmed){

    return;

  }


  const result =
    await supabaseClient
      .from("posts")
      .delete()
      .eq("id",id);


  if(result.error){

    alert(
      "❌ حذف انجام نشد:\n" +
      result.error.message
    );

    return;

  }


  alert(
    "✅ مطلب حذف شد."
  );


  loadPosts();

}


// ===============================
// CANCEL EDIT
// ===============================

function cancelEdit(){

  resetForm();

}


// ===============================
// RESET FORM
// ===============================

function resetForm(){

  editingId = null;


  document.getElementById("title")
    .value = "";

  document.getElementById("description")
    .value = "";

  document.getElementById("content")
    .value = "";

  document.getElementById("downloadUrl")
    .value = "";

  document.getElementById("imageFile")
    .value = "";


  document.getElementById("category")
    .value = "news";


  document.getElementById("preview")
    .src = "";

  document.getElementById("preview")
    .style.display = "none";


  document.getElementById("formTitle")
    .innerText =
      "➕ افزودن مطلب جدید";


  document.getElementById("submitBtn")
    .innerText =
      "🚀 انتشار مطلب";


  document.getElementById("cancelEditBtn")
    .classList.add("hidden");


  document.getElementById("postStatus")
    .innerText = "";

}


// ===============================
// ESCAPE
// ===============================

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


// ===============================
// AUTH STATE
// ===============================

supabaseClient.auth.onAuthStateChange(
  function(){

    checkAdmin();

  }
);


// ===============================
// START
// ===============================

checkAdmin();

</script>

</body>
</html>
