<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERSIAN STARK | پنل مدیریت</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#080b12;
  --panel:#101520;
  --panel2:#141b28;
  --border:#202a3a;
  --text:#f4f7fb;
  --muted:#8d99ab;
  --accent:#7c5cff;
  --accent2:#9b87ff;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#f59e0b;
  --shadow:0 20px 60px rgba(0,0,0,.30);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Vazirmatn',sans-serif;
  background:
    radial-gradient(circle at 80% 0%,rgba(124,92,255,.10),transparent 28%),
    radial-gradient(circle at 0% 100%,rgba(30,144,255,.07),transparent 25%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:430px;
  background:rgba(16,21,32,.92);
  border:1px solid var(--border);
  border-radius:24px;
  padding:34px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
}

.logo{
  text-align:center;
  margin-bottom:30px;
}

.logo strong{
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  font-size:13px;
  color:#b9c2d0;
  margin-bottom:8px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#0b1019;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px 14px;
  outline:none;
  transition:.2s;
}

.field textarea{
  min-height:130px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,92,255,.12);
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:linear-gradient(135deg,var(--accent),#6244ed);
  color:white;
}

.btn-dark{
  background:#192130;
  color:white;
  border:1px solid var(--border);
}

.btn-danger{
  background:rgba(239,68,68,.12);
  color:#ff7070;
  border:1px solid rgba(239,68,68,.25);
}

.btn-success{
  background:rgba(34,197,94,.12);
  color:#50e681;
  border:1px solid rgba(34,197,94,.25);
}

/* APP */

#app{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  flex-shrink:0;
  background:rgba(10,14,22,.96);
  border-left:1px solid var(--border);
  min-height:100vh;
  position:sticky;
  top:0;
  height:100vh;
  padding:22px 15px;
  z-index:50;
}

.brand{
  padding:10px 12px 24px;
  border-bottom:1px solid var(--border);
  margin-bottom:18px;
}

.brand-title{
  font-size:21px;
  font-weight:900;
  letter-spacing:1.5px;
}

.brand-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.menu-title{
  color:#697589;
  font-size:11px;
  font-weight:700;
  margin:15px 12px 8px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#aeb8c8;
  padding:12px 13px;
  border-radius:11px;
  text-align:right;
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:4px;
  transition:.2s;
}

.nav-btn:hover{
  background:#151d2b;
  color:white;
}

.nav-btn.active{
  background:linear-gradient(135deg,rgba(124,92,255,.20),rgba(124,92,255,.07));
  color:white;
  border:1px solid rgba(124,92,255,.20);
}

.nav-icon{
  width:28px;
  text-align:center;
  font-size:17px;
}

.sidebar-bottom{
  position:absolute;
  left:15px;
  right:15px;
  bottom:18px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
}

.topbar{
  height:74px;
  border-bottom:1px solid var(--border);
  background:rgba(8,11,18,.82);
  backdrop-filter:blur(15px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:40;
}

.top-title{
  font-size:19px;
  font-weight:800;
}

.top-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.admin-user{
  background:#111927;
  border:1px solid var(--border);
  padding:8px 13px;
  border-radius:11px;
  color:#b9c2d0;
  font-size:12px;
}

.mobile-menu{
  display:none;
}

.content{
  padding:28px;
  max-width:1500px;
  margin:auto;
}

/* DASHBOARD */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:24px;
}

.stat{
  background:linear-gradient(145deg,#111824,#0d131e);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  position:relative;
  overflow:hidden;
}

.stat:after{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  background:rgba(124,92,255,.09);
  border-radius:50%;
  left:-30px;
  bottom:-35px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

.stat-number{
  font-size:30px;
  font-weight:900;
  margin-top:8px;
}

.section-box{
  background:rgba(14,20,30,.9);
  border:1px solid var(--border);
  border-radius:18px;
  padding:21px;
  margin-bottom:20px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.section-head h2{
  font-size:17px;
}

.section-head p{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

/* POSTS */

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.toolbar select,
.toolbar input{
  background:#0b1019;
  color:white;
  border:1px solid var(--border);
  border-radius:11px;
  padding:11px 13px;
  outline:none;
}

.posts-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.post-row{
  background:#0c121c;
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:15px;
}

.post-image{
  width:78px;
  height:58px;
  border-radius:10px;
  object-fit:cover;
  background:#151d29;
  flex-shrink:0;
}

.post-info{
  flex:1;
  min-width:0;
}

.post-title{
  font-weight:800;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.post-meta{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:7px;
  flex-wrap:wrap;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:20px;
  padding:4px 9px;
  font-size:10px;
  font-weight:700;
}

.badge-news{
  background:rgba(59,130,246,.12);
  color:#60a5fa;
}

.badge-game{
  background:rgba(168,85,247,.12);
  color:#c084fc;
}

.badge-software{
  background:rgba(34,197,94,.12);
  color:#4ade80;
}

.badge-store{
  background:rgba(245,158,11,.12);
  color:#fbbf24;
}

.actions{
  display:flex;
  gap:7px;
  flex-shrink:0;
}

.small-btn{
  border:1px solid var(--border);
  background:#141c29;
  color:#d9dfeb;
  border-radius:9px;
  padding:8px 11px;
  font-size:11px;
}

.small-btn:hover{
  border-color:#39465d;
}

/* EDITOR */

.editor-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 320px;
  gap:20px;
}

.editor-main,
.editor-side{
  min-width:0;
}

.card{
  background:#0d141f;
  border:1px solid var(--border);
  border-radius:17px;
  padding:20px;
  margin-bottom:18px;
}

.card h3{
  font-size:15px;
  margin-bottom:17px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.full{
  grid-column:1/-1;
}

.category-preview{
  border:1px solid var(--border);
  background:#111927;
  border-radius:13px;
  padding:14px;
}

.category-preview strong{
  display:block;
  margin-bottom:5px;
}

.category-preview span{
  color:var(--muted);
  font-size:12px;
}

.cover-preview{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:12px;
  border:1px solid var(--border);
  background:#080c13;
  display:block;
  margin-top:10px;
}

/* BLOCKS */

.blocks{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.block{
  background:#0a1019;
  border:1px solid var(--border);
  border-radius:13px;
  padding:14px;
}

.block-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.block-label{
  font-size:12px;
  font-weight:800;
}

.block textarea{
  width:100%;
  min-height:110px;
  background:#0d141f;
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  outline:none;
  resize:vertical;
}

.block input{
  width:100%;
  background:#0d141f;
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px;
  outline:none;
}

.add-blocks{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* UPLOAD */

.upload-area{
  border:1px dashed #354156;
  border-radius:14px;
  padding:22px;
  text-align:center;
  background:#0a1019;
}

.upload-area p{
  color:var(--muted);
  font-size:12px;
  margin:6px 0 15px;
}

/* EMPTY */

.empty{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:38px;
  margin-bottom:10px;
}

/* TOAST */

#toast{
  position:fixed;
  bottom:25px;
  left:25px;
  z-index:9999;
  background:#111927;
  border:1px solid var(--border);
  color:white;
  padding:13px 17px;
  border-radius:12px;
  box-shadow:var(--shadow);
  transform:translateY(25px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  font-size:13px;
}

#toast.show{
  transform:translateY(0);
  opacity:1;
}

#toast.success{
  border-color:rgba(34,197,94,.35);
}

#toast.error{
  border-color:rgba(239,68,68,.35);
}

/* RESPONSIVE */

@media(max-width:1000px){
  .sidebar{
    width:220px;
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .editor-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:760px){

  #app{
    display:block;
  }

  .sidebar{
    position:fixed;
    top:0;
    right:-280px;
    width:260px;
    transition:.3s;
    box-shadow:0 0 50px rgba(0,0,0,.5);
  }

  .sidebar.open{
    right:0;
  }

  .mobile-menu{
    display:block;
    border:1px solid var(--border);
    background:#111927;
    color:white;
    width:42px;
    height:42px;
    border-radius:11px;
    font-size:19px;
  }

  .topbar{
    padding:0 14px;
  }

  .top-title{
    font-size:16px;
  }

  .admin-user{
    display:none;
  }

  .content{
    padding:15px;
  }

  .stats-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:15px;
  }

  .stat-number{
    font-size:23px;
  }

  .post-row{
    align-items:flex-start;
  }

  .post-image{
    width:65px;
    height:50px;
  }

  .actions{
    flex-direction:column;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .section-box,
  .card{
    padding:15px;
  }
}

@media(max-width:450px){
  .login-box{
    padding:24px 18px;
  }

  .stats-grid{
    grid-template-columns:1fr 1fr;
  }

  .post-title{
    white-space:normal;
  }

  .post-row{
    flex-wrap:wrap;
  }

  .actions{
    width:100%;
    flex-direction:row;
  }

  .actions button{
    flex:1;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="login-box">

    <div class="logo">
      <strong>PERSIAN STARK</strong>
      <span>پنل مدیریت سایت</span>
    </div>

    <div class="field">
      <label>ایمیل مدیر</label>
      <input id="loginEmail" type="email" placeholder="admin@example.com">
    </div>

    <div class="field">
      <label>رمز عبور</label>
      <input id="loginPassword" type="password" placeholder="••••••••">
    </div>

    <button class="btn btn-primary" style="width:100%" onclick="loginAdmin()">
      ورود به پنل
    </button>

  </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-title">PERSIAN STARK</div>
      <div class="brand-sub">CONTROL PANEL</div>
    </div>

    <div class="menu-title">مدیریت</div>

    <button class="nav-btn active" data-page="dashboard" onclick="showPage('dashboard')">
      <span class="nav-icon">⌂</span>
      داشبورد
    </button>

    <button class="nav-btn" data-page="posts" onclick="showPage('posts')">
      <span class="nav-icon">▤</span>
      مطالب سایت
    </button>

    <button class="nav-btn" data-page="editor" onclick="newPost()">
      <span class="nav-icon">＋</span>
      مطلب جدید
    </button>

    <div class="menu-title">دسته‌ها</div>

    <button class="nav-btn" data-page="news" onclick="showCategory('news')">
      <span class="nav-icon">◈</span>
      اخبار گیم
    </button>

    <button class="nav-btn" data-page="game" onclick="showCategory('game')">
      <span class="nav-icon">◉</span>
      معرفی بازی
    </button>

    <button class="nav-btn" data-page="software" onclick="showCategory('software')">
      <span class="nav-icon">▣</span>
      نرم‌افزار
    </button>

    <button class="nav-btn" data-page="store" onclick="showCategory('store')">
      <span class="nav-icon">◇</span>
      فروشگاه CS2
    </button>

    <div class="sidebar-bottom">

      <button class="nav-btn" onclick="openSite()">
        <span class="nav-icon">↗</span>
        مشاهده سایت
      </button>

      <button class="nav-btn" onclick="logoutAdmin()">
        <span class="nav-icon">⇥</span>
        خروج
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div class="top-right">
        <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
        <div class="top-title" id="pageTitle">داشبورد</div>
      </div>

      <div class="admin-user" id="adminUser">
        مدیر سایت
      </div>

    </header>

    <div class="content" id="content"></div>

  </main>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://jmdoxofcyoxdrtxvvuiu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NqGaaVTBkzHUdCsWyWLXSA_dBqD_Q74";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true,
      storageKey:"persian-stark-admin-auth"
    }
  }
);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let posts = [];
let editingPostId = null;
let blocks = [];


/* =========================================================
   TOAST
========================================================= */

function toast(message,type="success"){

  const el = document.getElementById("toast");

  el.textContent = message;

  el.className = "";
  el.id = "toast";
  el.classList.add("show",type);

  setTimeout(()=>{
    el.classList.remove("show");
  },3000);
}


/* =========================================================
   AUTH
========================================================= */

async function checkAuth(){

  const {
    data:{session}
  } = await db.auth.getSession();

  if(!session){
    showLogin();
    return;
  }

  const user = session.user;

  const {
    data:profile,
    error
  } = await db
    .from("profiles")
    .select("id,username,is_admin")
    .eq("id",user.id)
    .maybeSingle();

  if(error){
    console.error(error);
    showLogin();
    toast("خطا در بررسی حساب مدیر","error");
    return;
  }

  if(!profile || profile.is_admin !== true){

    await db.auth.signOut();

    showLogin();

    toast("این حساب دسترسی مدیر ندارد","error");

    return;
  }

  currentUser = user;

  document.getElementById("adminUser").textContent =
    profile.username || user.email;

  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  await loadPosts();

  showPage("dashboard");
}


db.auth.onAuthStateChange((event,session)=>{

  if(event === "SIGNED_OUT"){

    currentUser = null;

    showLogin();
  }

});


async function loginAdmin(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    toast("ایمیل و رمز عبور را وارد کن","error");

    return;
  }

  const {
    data,
    error
  } = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){

    toast(error.message,"error");

    return;
  }

  currentUser = data.user;

  await checkAuth();
}


async function logoutAdmin(){

  await db.auth.signOut();

  showLogin();

  toast("از پنل خارج شدی");
}


function showLogin(){

  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
}


/* =========================================================
   POSTS
========================================================= */

async function loadPosts(){

  const {
    data,
    error
  } = await db
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    toast("خطا در دریافت مطالب","error");

    return;
  }

  posts = data || [];
}


/* =========================================================
   PAGE SYSTEM
========================================================= */

function setActive(page){

  document
    .querySelectorAll(".nav-btn[data-page]")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );
    });
}


function pageTitle(title){

  document.getElementById("pageTitle").textContent = title;
}


function showPage(page){

  closeSidebar();

  setActive(page);

  if(page === "dashboard"){
    renderDashboard();
    return;
  }

  if(page === "posts"){
    renderPostsPage();
    return;
  }

  if(page === "editor"){
    renderEditor();
    return;
  }
}


function showCategory(category){

  closeSidebar();

  setActive(category);

  renderPostsPage(category);
}


/* =========================================================
   DASHBOARD
========================================================= */

async function renderDashboard(){

  pageTitle("داشبورد");

  const news =
    posts.filter(p=>p.category==="news").length;

  const games =
    posts.filter(p=>p.category==="game").length;

  const software =
    posts.filter(p=>p.category==="software").length;

  const store =
    posts.filter(p=>p.category==="store").length;

  document.getElementById("content").innerHTML = `

    <div class="stats-grid">

      <div class="stat">
        <div class="stat-label">کل مطالب</div>
        <div class="stat-number">${posts.length}</div>
      </div>

      <div class="stat">
        <div class="stat-label">اخبار گیم</div>
        <div class="stat-number">${news}</div>

/* =========================================================
   POSTS PAGE
========================================================= */

function renderPostsPage(filter=null){

  const titles = {
    news:"اخبار گیم",
    game:"معرفی بازی",
    software:"نرم‌افزار",
    store:"فروشگاه CS2"
  };

  pageTitle(
    filter ? titles[filter] : "مطالب سایت"
  );

  let list = filter
    ? posts.filter(p=>p.category===filter)
    : posts;

  document.getElementById("content").innerHTML = `

    <div class="section-box">

      <div class="section-head">

        <div>
          <h2>
            ${filter ? titles[filter] : "همه مطالب"}
          </h2>

          <p>
            ${list.length} مطلب
          </p>
        </div>

        <button class="btn btn-primary" onclick="newPost()">
          ＋ مطلب جدید
        </button>

      </div>


      <div class="toolbar">

        <select id="categoryFilter" onchange="applyFilter()">

          <option value="">همه دسته‌ها</option>

          <option value="news"
            ${filter==="news"?"selected":""}>
            اخبار گیم
          </option>

          <option value="game"
            ${filter==="game"?"selected":""}>
            معرفی بازی
          </option>

          <option value="software"
            ${filter==="software"?"selected":""}>
            نرم‌افزار
          </option>

          <option value="store"
            ${filter==="store"?"selected":""}>
            فروشگاه CS2
          </option>

        </select>

        <input
          id="searchPosts"
          placeholder="جستجو بین مطالب..."
          oninput="applyFilter()"
        >

      </div>


      <div class="posts-list" id="postsList">

        ${
          list.length
          ? list.map(postRowHTML).join("")
          : emptyPostsHTML()
        }

      </div>

    </div>
  `;
}


function applyFilter(){

  const category =
    document.getElementById("categoryFilter").value;

  const query =
    document.getElementById("searchPosts").value
      .trim()
      .toLowerCase();

  let list = category
    ? posts.filter(p=>p.category===category)
    : [...posts];

  if(query){

    list =
      list.filter(p=>
        (p.title||"").toLowerCase().includes(query) ||
        (p.description||"").toLowerCase().includes(query)
      );
  }

  document.getElementById("postsList").innerHTML =
    list.length
    ? list.map(postRowHTML).join("")
    : emptyPostsHTML();
}


function emptyPostsHTML(){

  return `
    <div class="empty">
      <div class="empty-icon">⌁</div>
      مطلبی پیدا نشد
    </div>
  `;
}


function postRowHTML(post){

  const cat = post.category || "news";

  const categoryNames = {
    news:"اخبار گیم",
    game:"معرفی بازی",
    software:"نرم‌افزار",
    store:"فروشگاه CS2"
  };

  const categoryClass = {
    news:"badge-news",
    game:"badge-game",
    software:"badge-software",
    store:"badge-store"
  };

  return `

    <div class="post-row">

      <img
        class="post-image"
        src="${escapeHTML(post.image_url || "")}"
        onerror="this.style.visibility='hidden'"
      >

      <div class="post-info">

        <div class="post-title">
          ${escapeHTML(post.title || "بدون عنوان")}
        </div>

        <div class="post-meta">

          <span class="badge ${categoryClass[cat] || "badge-news"}">
            ${categoryNames[cat] || cat}
          </span>

          <span style="color:#68758a;font-size:10px">
            ${formatDate(post.created_at)}

      </div>


      <div class="actions">

        <button
          class="small-btn"
          onclick="editPost('${post.id}')">

        <button
          class="small-btn"
          onclick="deletePost('${post.id}')">

}


/* =========================================================
   EDITOR
========================================================= */

function newPost(){

  editingPostId = null;
  blocks = [];

  closeSidebar();

  setActive("editor");

  renderEditor();
}


async function editPost(id){

  const post =
    posts.find(p=>String(p.id)===String(id));

  if(!post) return;

  editingPostId = id;

  const {
    data,
    error
  } = await db
    .from("post_blocks")
    .select("*")
    .eq("post_id",id)
    .order("sort_order",{ascending:true});

  if(error){

    console.error(error);

    toast("خطا در دریافت بلوک‌های مقاله","error");

    return;
  }

  blocks = data || [];

  setActive("editor");

  renderEditor(post);
}

function updateCategoryPreview(){

  const value = select.value;

      title:"نرم‌افزار",

/* =========================================================
   BLOCKS
========================================================= */

function addBlock(type){

  blocks.push({
    id:null,
    type,
    content:"",
    sort_order:blocks.length
  });

  renderBlocks();
}


function renderBlocks(){

  const container =
    document.getElementById("blocksContainer");

  if(!container) return;

  if(!blocks.length){

    container.innerHTML = `
      <div class="empty" style="padding:30px">
        هنوز بلوکی اضافه نشده
      </div>
    `;

    return;
  }

  container.innerHTML =
    blocks.map((block,index)=>{

      let content = "";

      if(block.type === "text"){

        content = `
          <textarea
            oninput="blocks[${index}].content=this.value"
            placeholder="متن این بخش..."
          >${escapeHTML(block.content || "")}</textarea>
        `;

      }

      if(block.type === "image"){

        content = `
          <input
            value="${escapeAttr(block.content || "")}"
            oninput="blocks[${index}].content=this.value"
            placeholder="لینک تصویر..."
          >
        `;
      }

      if(block.type === "video"){

        content = `
          <input
            value="${escapeAttr(block.content || "")}"
            oninput="blocks[${index}].content=this.value"
            placeholder="لینک ویدیو..."
          >
        `;
      }

      const labels = {
        text:"متن",
        image:"تصویر",
        video:"ویدیو"
      };

      return `

        <div class="block">

          <div class="block-head">

            <div class="block-label">
              ${index+1}. ${labels[block.type]}
            </div>

            <button
              class="small-btn"
              onclick="removeBlock(${index})">
              حذف
            </button>

          </div>

          ${content}

        </div>
      `;

    }).join("");
}


function removeBlock(index){

  blocks.splice(index,1);

  renderBlocks();
}


/* =========================================================
   SAVE POST
========================================================= */

async function savePost(){

  const title =
    document.getElementById("postTitle").value.trim();

  const category =
    document.getElementById("postCategory").value;

  const description =
    document.getElementById("postDescription").value.trim();

  const content =
    document.getElementById("postContent").value.trim();

  const image_url =
    document.getElementById("postImage").value.trim();

  const download_url =
    document.getElementById("postDownload").value.trim();

  if(!title){

    toast("عنوان مطلب را وارد کن","error");

    return;
  }

  if(!category){

    toast("دسته‌بندی را انتخاب کن","error");

    return;
  }

  const payload = {

    title,
    category,
    description,
    content,
    image_url,
    download_url

  };


  let postId = editingPostId;


  if(editingPostId){

    const {
      error
    } = await db
      .from("posts")
      .update(payload)
      .eq("id",editingPostId);

    if(error){

      console.error(error);

      toast("خطا در ویرایش مطلب","error");

      return;
    }

  }else{

    const {
      data,
      error
    } = await db
      .from("posts")
      .insert(payload)
      .select()
      .single();

    if(error){

      console.error(error);

      toast("خطا در ساخت مطلب","error");

      return;
    }

    postId = data.id;
  }


  /* DELETE OLD BLOCKS */

  if(editingPostId){

    const {
      error
    } = await db
      .from("post_blocks")
      .delete()
      .eq("post_id",editingPostId);

    if(error){

      console.error(error);

      toast("خطا در بروزرسانی بلوک‌ها","error");

      return;
    }
  }


  /* INSERT BLOCKS */

  if(blocks.length){

    const rows =
      blocks.map((block,index)=>({

        post_id:postId,
        type:block.type,
        content:block.content || "",
        sort_order:index

      }));

    const {
      error
    } = await db
      .from("post_blocks")
      .insert(rows);

    if(error){

      console.error(error);

      toast("مطلب ذخیره شد ولی بلوک‌ها ذخیره نشدند","error");

      await loadPosts();

      showPage("posts");

      return;
    }
  }


  await loadPosts();

  toast(
    editingPostId
      ? "مطلب با موفقیت ویرایش شد ✓"
      : "مطلب با موفقیت منتشر شد ✓"
  );

  editingPostId = null;
  blocks = [];

  setTimeout(()=>{
    showPage("posts");
  },500);
}


/* =========================================================
   DELETE
========================================================= */

async function deletePost(id){

  const post =
    posts.find(p=>String(p.id)===String(id));

  if(!post) return;

  const ok =
    confirm(
      `مطلب «${post.title}» حذف شود؟\n\nاین کار قابل برگشت نیست.`
    );

  if(!ok) return;


  const {
    error
  } = await db
    .from("posts")
    .delete()
    .eq("id",id);

  if(error){

    console.error(error);

    toast("حذف انجام نشد","error");

    return;
  }


  await loadPosts();

  toast("مطلب حذف شد");

  showPage("posts");
}


/* =========================================================
   IMAGE UPLOAD
========================================================= */

async function uploadImage(){

  const file =
    document.getElementById("imageUpload").files[0];

  if(!file) return;

  const status =
    document.getElementById("uploadStatus");

  status.textContent =
    "در حال آپلود...";

  const safeName =
    file.name
      .replace(/[^\w.\-]+/g,"-")
      .toLowerCase();

  const path =
    `${Date.now()}-${safeName}`;


  const {
    error
  } = await db
    .storage
    .from("images")
    .upload(path,file,{
      cacheControl:"3600",
      upsert:false
    });


  if(error){

    console.error(error);

    status.textContent =
      "آپلود ناموفق بود.";

    toast(
      "آپلود تصویر انجام نشد. دسترسی Storage را بررسی کن.",
      "error"
    );

    return;
  }


  const {
    data
  } = db
    .storage
    .from("images")
    .getPublicUrl(path);


  document.getElementById("postImage").value =
    data.publicUrl;

  updateCoverPreview();

  status.textContent =
    "تصویر با موفقیت آپلود شد ✓";

  toast("تصویر آپلود شد ✓");
}


/* =========================================================
   PREVIEW
========================================================= */

function updateCoverPreview(){

  const url =
    document.getElementById("postImage").value.trim();

  const img =
    document.getElementById("coverPreview");

  if(!url){

    img.style.display="none";

    return;
  }

  img.src=url;
  img.style.display="block";
}


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/\n/g,"&#10;");
}


function formatDate(date){

  if(!date) return "";

  try{

    return new Date(date).toLocaleDateString(
      "fa-IR",
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

  }catch{

    return "";
  }
}
