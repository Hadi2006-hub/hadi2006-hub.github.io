
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERSIAN STARK</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
min-height:100vh;
font-family:Vazirmatn,sans-serif;
background:#070a11;
color:#fff;
overflow-x:hidden;
transition:.3s;
}

body.light{
background:#f3f5f9;
color:#111827;
}

#background{
position:fixed;
inset:0;
z-index:-10;
background:
radial-gradient(circle at 15% 20%,#17345d 0,transparent 34%),
radial-gradient(circle at 85% 70%,#3b1257 0,transparent 34%),
linear-gradient(120deg,#05070c,#101827,#060912);
animation:bgMove 14s ease-in-out infinite alternate;
}

@keyframes bgMove{
from{transform:scale(1)}
to{transform:scale(1.12) translate(1%,1%)}
}

#overlay{
position:fixed;
inset:0;
background:#000;
z-index:-9;
pointer-events:none;
}

.container{
width:min(1200px,92%);
margin:auto;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:100;
background:rgba(5,8,15,.82);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(255,255,255,.08);
}

body.light header{
background:rgba(255,255,255,.86);
border-color:#ddd;
}

.nav{
min-height:70px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}

.logo{
font-size:23px;
font-weight:900;
letter-spacing:2px;
color:#fff;
text-shadow:0 0 20px #8b5cf6;
cursor:pointer;
white-space:nowrap;
}

body.light .logo{
color:#111827;
}

nav{
display:flex;
align-items:center;
gap:7px;
}

nav button{
background:transparent;
color:#dce2ef;
border:1px solid transparent;
padding:9px 12px;
border-radius:10px;
font-family:inherit;
font-weight:700;
cursor:pointer;
transition:.2s;
}

nav button:hover{
background:rgba(124,58,237,.16);
border-color:rgba(124,58,237,.3);
color:#fff;
}

body.light nav button{
color:#374151;
}

body.light nav button:hover{
color:#111827;
}

.mobile-menu{
display:none;
background:#7c3aed;
border:0;
color:white;
width:42px;
height:42px;
border-radius:11px;
font-size:22px;
cursor:pointer;
}

/* MOBILE MENU */

.mobile-panel{
position:fixed;
top:70px;
right:0;
left:0;
z-index:99;
display:none;
padding:12px;
background:rgba(7,10,17,.97);
border-bottom:1px solid rgba(255,255,255,.1);
box-shadow:0 20px 40px rgba(0,0,0,.3);
}

.mobile-panel.show{
display:block;
}

.mobile-panel button{
width:100%;
margin:4px 0;
padding:13px;
border:0;
border-radius:12px;
background:#151c2b;
color:white;
font-family:inherit;
font-weight:700;
text-align:right;
cursor:pointer;
}

body.light .mobile-panel{
background:rgba(255,255,255,.98);
}

body.light .mobile-panel button{
background:#f1f3f7;
color:#111827;
}

/* HERO */

.hero{
padding:65px 0 20px;
text-align:center;
}

.hero h1{
margin:0;
font-size:clamp(38px,7vw,72px);
font-weight:900;
text-shadow:0 0 35px #7c3aed;
}

.hero p{
max-width:700px;
margin:15px auto 25px;
line-height:2;
color:#aeb7ca;
}

body.light .hero p{
color:#5b6475;
}

/* STATS */

.stats{
display:flex;
justify-content:center;
align-items:center;
gap:18px;
margin:12px auto 28px;
padding:8px 16px;
width:max-content;
max-width:96%;
border-radius:30px;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.07);
backdrop-filter:blur(12px);
}

.stat{
display:flex;
align-items:center;
gap:5px;
padding:0;
background:transparent;
border:0;
box-shadow:none;
text-align:center;
}

.stat strong{
display:inline;
font-size:13px;
margin:0;
color:#a78bfa;
}

.stat span{
color:#929bad;
font-size:11px;
}

/* SECTIONS */

.section{
padding-top:20px;
scroll-margin-top:90px;
}

.section-title{
display:flex;
align-items:center;
justify-content:space-between;
margin:25px 0 17px;
}

.section-title h2{
margin:0;
font-size:24px;
}

/* CARDS */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
padding-bottom:35px;
}

.card{
overflow:hidden;
border-radius:18px;
background:rgba(14,19,31,.88);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 15px 40px rgba(0,0,0,.18);
}

body.light .card{
background:#fff;
border-color:#e3e6ec;
}

.card img{
display:block;
width:100%;
height:190px;
object-fit:cover;
}

.card-body{
padding:17px;
}

.card h3{
margin:0 0 8px;
font-size:19px;
}

.card p{
min-height:50px;
margin:0;
color:#aeb7ca;
font-size:14px;
line-height:1.9;
}

body.light .card p{
color:#5b6475;
}

.badge{
display:inline-block;
padding:4px 9px;
border-radius:20px;
background:#7c3aed;
font-size:11px;
margin-bottom:9px;
}

.card-actions{
display:flex;
gap:8px;
margin-top:15px;
}

.card-actions button{
flex:1;
}

.btn{
border:0;
border-radius:11px;
padding:10px 14px;
font-family:inherit;
font-weight:700;
cursor:pointer;
background:#7c3aed;
color:white;
}

.btn.secondary{
background:#222c3f;
}

.btn.danger{
background:#dc2626;
}

.empty{
grid-column:1/-1;
text-align:center;
padding:45px;
color:#8f98aa;
}

/* ARTICLE */

.article-title{
font-size:clamp(25px,5vw,42px);
font-weight:900;
line-height:1.5;
margin:8px 0 20px;
}

.article-cover{
width:100%;
max-height:480px;
object-fit:cover;
border-radius:16px;
margin-bottom:22px;
}

.block-text{
font-size:17px;
line-height:2.25;
white-space:pre-wrap;
margin:22px 0;
}

.block-image{
display:block;
width:100%;
max-height:700px;
object-fit:contain;
border-radius:15px;
margin:20px 0;
background:#05070b;
}

.block-video{
display:block;
width:100%;
max-height:650px;
border-radius:15px;
margin:20px 0;
background:#000;
}

/* MODAL */

.modal{
display:none;
position:fixed;
inset:0;
z-index:200;
padding:15px;
background:rgba(0,0,0,.78);
overflow:auto;
}

.modal.show{
display:flex;
align-items:center;
justify-content:center;
}

.modal-box{
position:relative;
width:min(900px,100%);
max-height:94vh;
overflow:auto;
padding:25px;
border-radius:22px;
background:#111827;
border:1px solid #30394d;
}

body.light .modal-box{
background:#fff;
border-color:#ddd;
color:#111827;
}

.close{
position:absolute;
left:13px;
top:13px;
width:38px;
height:38px;
padding:0;
border:0;
border-radius:50%;
background:#dc2626;
color:#fff;
font-size:23px;
cursor:pointer;
}

/* AUTH */

.auth{
width:min(430px,100%);
}

.auth h2{
text-align:center;
margin-top:5px;
}

.auth input{
width:100%;
padding:13px;
margin:7px 0;
border-radius:11px;
border:1px solid #374151;
background:#0b1220;
color:white;
font-family:inherit;
outline:none;
}

body.light .auth input{
background:#f8fafc;
color:#111827;
border-color:#d1d5db;
}

.auth>button:not(.close){
width:100%;
margin-top:8px;
}

/* FOOTER */

footer{
margin-top:20px;
padding:35px 0;
text-align:center;
color:#8f98aa;
border-top:1px solid rgba(255,255,255,.08);
}

/* RESPONSIVE */

@media(max-width:900px){

nav{
display:none;
}

.mobile-menu{
display:block;
}

.grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

.container{
width:94%;
}

.nav{
min-height:62px;
}

.logo{
font-size:18px;
}

.hero{
padding-top:48px;
}

.hero h1{
font-size:42px;
}

.stats{
gap:8px;
padding:7px 10px;
width:96%;
}

.stat{
gap:3px;
}

.stat strong{
font-size:11px;
}

.stat span{
font-size:9px;
}

.grid{
grid-template-columns:1fr;
}

.card img{
height:210px;
}

.modal{
padding:7px;
}

.modal-box{
padding:18px;
border-radius:17px;
}

.block-text{
font-size:15px;
line-height:2.15;
}

}
</style>
</head>

<body>

<div id="background"></div>
<div id="overlay"></div>

<header>
<div class="container nav">

PERSIAN STARK
</div>

<script>

const SUPABASE_URL =
"https://jmdoxofcyoxdrtxvvuiu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NqGaaVTBkzHUdCsWyWLXSA_dBqD_Q74";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// SESSION

let sessionId =
localStorage.getItem("ps_session_id");

if(!sessionId){

sessionId =
crypto.randomUUID();

localStorage.setItem(
"ps_session_id",
sessionId
);

}


// MOBILE MENU

function toggleMobileMenu(){

document
.getElementById("mobilePanel")
.classList.toggle("show");

}

function closeMobileMenu(){

document
.getElementById("mobilePanel")
.classList.remove("show");

}

function mobileGo(section){

closeMobileMenu();

if(section==="home"){
goHome();
return;
}

scrollToSection(section);

}

function mobileAuth(){

closeMobileMenu();
openAuth();

}

function mobileStore(){

closeMobileMenu();
openStore();

}


// HOME

function goHome(){

closeMobileMenu();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


// SCROLL

function scrollToSection(id){

closeMobileMenu();

const el =
document.getElementById(id);

if(el){

el.scrollIntoView({
behavior:"smooth"
});

}

}


// SETTINGS

async function loadSettings(){

const {data,error} =
await supabaseClient
.from("site_settings")
.select("*")
.limit(1)
.maybeSingle();

if(error || !data){

return;

}


// THEME

if(data.theme==="light"){

document.body.classList.add("light");

}

else{

document.body.classList.remove("light");

}


// OVERLAY

document.getElementById("overlay")
.style.opacity =
(data.background_overlay || 55)/100;


// BACKGROUND

const bg =
document.getElementById("background");

if(!data.background_enabled ||
data.background_type==="none"){

bg.style.display="none";
return;

}

bg.style.display="block";


if(
data.background_type==="image" &&
data.background_url
){

bg.innerHTML="";

bg.style.backgroundImage =
`url("${data.background_url}")`;

bg.style.backgroundSize="cover";
bg.style.backgroundPosition="center";
bg.style.animation="none";

}


else if(
data.background_type==="video" &&
data.background_url
){

bg.innerHTML=`

<video
autoplay
loop
playsinline
${data.background_muted ? "muted":""}
style="
width:100%;
height:100%;
object-fit:cover;
">

<source src="${escapeAttr(data.background_url)}">

</video>
`;

bg.style.animation="none";

}

else{

bg.innerHTML="";

bg.style.backgroundImage="";

}

}


// POSTS

async function loadPosts(){

const {data,error} =
await supabaseClient
.from("posts")
.select("*")
.order("created_at",{ascending:false});

if(error){

console.error(error);

return;

}

const news =
document.getElementById("newsGrid");

const games =
document.getElementById("gamesGrid");

const software =
document.getElementById("softwareGrid");

news.innerHTML="";
games.innerHTML="";
software.innerHTML="";


if(!data || !data.length){

news.innerHTML =
`<div class="empty">
هنوز مطلبی منتشر نشده است.
</div>`;

return;

}


data.forEach(post=>{

const card =
createCard(post);

const category =
String(post.category || "")
.toLowerCase();


if(
category==="game" ||
category==="games"
){

games.innerHTML += card;

}

else if(
category==="software"
){

software.innerHTML += card;

}

else{

news.innerHTML += card;

}

});

}


// CARD

function createCard(post){

const image =
post.image_url ||
"https://images.unsplash.com/photo-1542751371-adc38448a05e";

return `

<article class="card">

<img
src="${escapeAttr(image)}"
loading="lazy"
alt=""
>

<div class="card-body">

<span class="badge">
${escapeHTML(post.category || "news")}
</span>

<h3>
${escapeHTML(post.title || "بدون عنوان")}
</h3>

<p>
${escapeHTML(post.description || "")}
</p>

<div class="card-actions">

<button
onclick="openArticle(${post.id})"
>
ادامه مطلب
</button>

${
post.download_url
?
`
<button
class="btn secondary"
onclick="window.open('${escapeAttr(post.download_url)}','_blank')"
>
دانلود
</button>
`
:
""
}

</div>

</div>

</article>

`;

}


// ARTICLE

async function openArticle(postId){

document
.getElementById("articleModal")
.classList.add("show");

const box =
document.getElementById("articleContent");

box.innerHTML =
`<p style="text-align:center">
در حال بارگذاری مطلب...
</p>`;


const {
data:post,
error:postError
} =
await supabaseClient
.from("posts")
.select("*")
.eq("id",postId)
.single();


if(postError){

box.innerHTML =
`<p>خطا در دریافت مطلب.</p>`;

return;

}


const {
data:blocks,
error:blockError
} =
await supabaseClient
.from("post_blocks")
.select("*")
.eq("post_id",postId)
.order("sort_order",{ascending:true});


if(blockError){

console.error(blockError);

box.innerHTML = `

<h1 class="article-title">
${escapeHTML(post.title)}
</h1>

<div class="block-text">
${escapeHTML(
post.content ||
post.description ||
""
)}
</div>

<p style="color:#f87171">
بخش‌های چندرسانه‌ای مقاله بارگذاری نشد.
</p>

`;

return;

}


let html = `

<span class="badge">
${escapeHTML(post.category || "news")}
</span>

<h1 class="article-title">
${escapeHTML(post.title || "")}
</h1>

`;


if(post.image_url){

html += `

<img
class="article-cover"
src="${escapeAttr(post.image_url)}"
loading="lazy"
>

`;

}


// BLOCKS

if(!blocks || !blocks.length){

html += `

<div class="block-text">
${escapeHTML(
post.content ||
post.description ||
""
)}
</div>

`;

}

else{

blocks.forEach(block=>{

if(block.type==="text"){

html += `

<div class="block-text">
${escapeHTML(block.content || "")}
</div>

`;

}

else if(block.type==="image"){

html += `

<img
class="block-image"
src="${escapeAttr(block.content)}"
loading="lazy"
alt=""
>

`;

}

else if(block.type==="video"){

html += `

<video
class="block-video"
controls
preload="metadata"
playsinline
>

<source
src="${escapeAttr(block.content)}"
>

مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.

</video>

`;

}

});

}


if(post.download_url){

html += `

<div style="
text-align:center;
margin-top:30px;
">

<a
class="btn"
href="${escapeAttr(post.download_url)}"
target="_blank"
rel="noopener"
>
⬇️ دانلود
</a>

</div>

`;

}


box.innerHTML=html;

}


// AUTH

let isSignup=false;


function openAuth(){

supabaseClient.auth.getSession()
.then(({data})=>{

if(data.session){

showUser();

}

else{

isSignup=false;

updateAuthUI();

document
.getElementById("authModal")
.classList.add("show");

}

});

}


function toggleAuth(){

isSignup=!isSignup;

updateAuthUI();

}


function updateAuthUI(){

document
.getElementById("authTitle")
.textContent =
isSignup
?
"ساخت حساب"
:
"ورود به حساب";


document
.getElementById("authButton")
.textContent =
isSignup
?
"ثبت نام"
:
"ورود";


document
.getElementById("switchAuth")
.textContent =
isSignup
?
"قبلاً حساب دارم"
:
"ساخت حساب جدید";


document
.getElementById("usernameInput")
.style.display =
isSignup
?
"block"
:
"none";

}


async function submitAuth(){

const email =
document
.getElementById("emailInput")
.value
.trim();

const password =
document
.getElementById("passwordInput")
.value;

const username =
document
.getElementById("usernameInput")
.value
.trim();

const status =
document.getElementById("authStatus");


status.textContent =
"در حال انجام...";


if(!email || !password){

status.textContent =
"ایمیل و رمز عبور را وارد کن.";

return;

}


if(isSignup){

if(!username){

status.textContent =
"نام کاربری را وارد کن.";

return;

}


const {
data,
error
} =
await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
username:username
}
}

});


if(error){

status.textContent =
error.message;

return;

}


if(data.session){

status.textContent =
"ثبت نام با موفقیت انجام شد.";

setTimeout(()=>{

closeModal("authModal");

},500);

}

else{

status.textContent =
"حساب ساخته شد. اگر تأیید ایمیل فعال است، ایمیلت را بررسی کن.";

}

}

else{

const {
data,
error
} =
await supabaseClient.auth.signInWithPassword({

email,
password

});


if(error){

status.textContent =
error.message;

return;

}


status.textContent =
"ورود موفق بود.";

setTimeout(()=>{

closeModal("authModal");
loadStats();

},500);

}

}


// USER

async function showUser(){

const {
data
} =
await supabaseClient.auth.getUser();

if(!data.user)return;


document
.getElementById("userEmail")
.textContent =
"ایمیل: "+
(data.user.email || "");


document
.getElementById("userName")
.textContent =
"نام کاربری: "+
(
data.user.user_metadata?.username ||
"کاربر PERSIAN STARK"
);


document
.getElementById("userModal")
.classList.add("show");

}


async function logout(){

await supabaseClient.auth.signOut();

closeModal("userModal");

loadStats();

}


// PRESENCE

async function updatePresence(){

try{

await supabaseClient.rpc(
"update_presence",
{
p_session_id:sessionId
}
);

}
catch(error){

console.error(
"presence:",
error
);

}

}

async function recordVisit(){

await supabaseClient.rpc(
"record_site_visit",
{
p_session_id:sessionId
}
);

}
catch(error){

console.error(
"visit:",
error
);

}

}


// STATS

async function loadStats(){

try{

const {
data,
error
} =
await supabaseClient.rpc(
"get_site_stats"
);

if(error){

console.error(
"stats:",
error
);

return;

}


document
.getElementById("membersCount")
.textContent =
data?.members ?? 0;


document
.getElementById("onlineCount")
.textContent =
data?.online ?? 0;


document
.getElementById("todayVisits")
.textContent =
data?.today_visits ?? 0;


document
.getElementById("totalVisits")
.textContent =
data?.total_visits ?? 0;

}
catch(error){

console.error(error);

}

}


// MODALS

function openStore(){

document
.getElementById("storeModal")
.classList.add("show");

}

function closeModal(id){

document
.getElementById(id)
.classList.remove("show");

}


// ESCAPE

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttr(value){

return String(value ?? "")
.replace(/"/g,"%22")
.replace(/'/g,"%27");

}


// AUTH STATE

supabaseClient.auth.onAuthStateChange(
(event,session)=>{

if(session){

updatePresence();

}

}
);


// START

async function start(){

await loadSettings();

await loadPosts();

await recordVisit();

await updatePresence();

await loadStats();

setInterval(async()=>{

await updatePresence();

await loadStats();

},30000);

}

start();

</script>
