<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PERSIAN STARK | مطلب</title>

<link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root{

    --bg:#07111f;

    --card:#0d1b2d;

    --card2:#102238;

    --text:#f5f9ff;

    --muted:#9eafc4;

    --line:rgba(255,255,255,.09);

    --accent:#00c8ff;

    --accent2:#18e0c1;

    --orange:#ff9d42;

    --danger:#ff526d;

    --max:1200px;

}

html.light{

    --bg:#f3f7fb;

    --card:#ffffff;

    --card2:#f8fbfe;

    --text:#102033;

    --muted:#607087;

    --line:rgba(16,32,51,.11);

    --accent:#008fd1;

    --accent2:#00a98f;

    --orange:#ed7b19;
}

*{

    box-sizing:border-box;

    margin:0;

    padding:0;

}

html{

    scroll-behavior:smooth;

}

body{

    font-family:"Vazirmatn",sans-serif;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(0,200,255,.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 40%,
            rgba(24,224,193,.07),
            transparent 30%
        ),
        var(--bg);

    color:var(--text);

    min-height:100vh;

    transition:.3s;
}


/* ================= HEADER ================= */

header{

    position:sticky;

    top:0;

    z-index:1000;

    background:rgba(5,14,26,.80);

    backdrop-filter:blur(18px);

    border-bottom:1px solid var(--line);
}

html.light header{

    background:rgba(255,255,255,.82);
}

.nav{

    max-width:var(--max);

    height:75px;

    margin:auto;

    padding:0 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}

.logo{

    color:var(--text);

    text-decoration:none;

    font-size:20px;

    font-weight:900;
}

.logo span{

    color:var(--accent);
}

.nav-actions{

    display:flex;

    gap:8px;
}

.nav-btn{

    border:1px solid var(--line);

    background:rgba(255,255,255,.04);

    color:var(--text);

    width:42px;

    height:42px;

    border-radius:10px;

    cursor:pointer;

    font-family:inherit;
}


/* ================= PAGE ================= */

.page{

    max-width:var(--max);

    margin:auto;

    padding:45px 20px 80px;
}

.back{

    display:inline-flex;

    color:var(--accent);

    text-decoration:none;

    font-size:13px;

    margin-bottom:25px;
}

.article-layout{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        300px;

    gap:25px;

    align-items:start;
}

.article{

    background:var(--card);

    border:1px solid var(--line);

    border-radius:24px;

    overflow:hidden;
}

.article-head{

    padding:35px 38px 25px;
}

.category{

    display:inline-flex;

    padding:7px 12px;

    border-radius:999px;

    background:rgba(0,200,255,.09);

    border:1px solid rgba(0,200,255,.25);

    color:var(--accent);

    font-size:12px;

    margin-bottom:17px;
}

.article h1{

    font-size:
        clamp(
            28px,
            5vw,
            52px
        );

    line-height:1.35;

    font-weight:900;

    margin-bottom:18px;
}

.description{

    color:var(--muted);

    font-size:16px;

    line-height:2;

    margin-bottom:18px;
}

.meta{

    color:var(--muted);

    font-size:12px;
}

.cover{

    width:100%;

    max-height:600px;

    object-fit:cover;

    display:block;
}

.article-content{

    padding:35px 38px;

    line-height:2.25;

    font-size:16px;
}

.article-content p{

    margin-bottom:24px;
}

.article-content img{

    display:block;

    width:100%;

    max-height:700px;

    object-fit:cover;

    border-radius:16px;

    margin:30px 0;
}

.article-content iframe{

    width:100%;

    aspect-ratio:16/9;

    border:0;

    border-radius:16px;

    margin:30px 0;
}

.article-content h2{

    font-size:28px;

    margin:35px 0 18px;
}

.article-content h3{

    font-size:22px;

    margin:30px 0 15px;
}


/* ================= SIDEBAR ================= */

.sidebar{

    position:sticky;

    top:100px;

}

.side-box{

    background:var(--card);

    border:1px solid var(--line);

    border-radius:20px;

    padding:22px;

    margin-bottom:18px;
}

.side-title{

    font-weight:900;

    margin-bottom:18px;
}

.side-post{

    display:block;

    color:var(--text);

    text-decoration:none;

    padding:12px 0;

    border-bottom:1px solid var(--line);

    font-size:13px;

    line-height:1.8;
}

.side-post:last-child{

    border-bottom:0;
}


/* ================= COMMENTS ================= */

.comments{

    margin-top:25px;

    background:var(--card);

    border:1px solid var(--line);

    border-radius:24px;

    padding:30px;
}

.comments-title{

    font-size:25px;

    font-weight:900;

    margin-bottom:7px;
}

.comments-sub{

    color:var(--muted);

    font-size:13px;

    margin-bottom:25px;
}

.comment-login{

    padding:20px;

    border:1px dashed var(--line);

    border-radius:15px;

    color:var(--muted);

    text-align:center;

    margin-bottom:25px;
}

.comment-login button{

    margin-top:12px;

    border:0;

    border-radius:10px;

    padding:10px 18px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    color:#00121c;

    font-family:inherit;

    font-weight:800;

    cursor:pointer;
}

.comment-form{

    display:none;

    margin-bottom:30px;
}

.comment-form.show{

    display:block;
}

.comment-form textarea{

    width:100%;

    min-height:130px;

    resize:vertical;

    border:1px solid var(--line);

    background:rgba(0,0,0,.13);

    color:var(--text);

    border-radius:14px;

    padding:15px;

    font-family:inherit;

    outline:none;
}

html.light .comment-form textarea{

    background:#fff;
}

.comment-form textarea:focus{

    border-color:var(--accent);
}

.comment-submit{

    margin-top:10px;

    border:0;

    border-radius:10px;

    padding:11px 20px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    color:#00121c;

    font-family:inherit;

    font-weight:900;

    cursor:pointer;
}

.comment{

    padding:20px 0;

    border-top:1px solid var(--line);
}

.comment-head{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:10px;
}

.comment-user{

    font-weight:800;

    font-size:14px;
}

.comment-date{

    color:var(--muted);

    font-size:11px;
}

.comment-text{

    color:var(--muted);

    line-height:2;

    font-size:14px;

    white-space:pre-wrap;
}

.delete-comment{

    border:0;

    background:transparent;

    color:var(--danger);

    font-family:inherit;

    font-size:11px;

    cursor:pointer;

    margin-top:10px;
}

.no-comments{

    text-align:center;

    padding:30px;

    color:var(--muted);
}


/* ================= LOADING ================= */

.loading{

    text-align:center;

    padding:60px;

    color:var(--muted);
}


/* ================= MOBILE ================= */

@media(max-width:900px){

    .article-layout{

        grid-template-columns:1fr;
    }

    .sidebar{

        position:static;
    }

}

@media(max-width:600px){

    .nav{

        height:65px;

        padding:0 15px;
    }

    .logo{

        font-size:17px;
    }

    .page{

        padding:
            25px
            12px
            60px;
    }

    .article{

        border-radius:18px;
    }

    .article-head{

        padding:
            25px
            20px
            20px;
    }

    .article-content{

        padding:
            25px 20px;
    }

    .comments{

        padding:22px 18px;

        border-radius:18px;
    }

}

</style>

</head>


<body>


<header>

<nav class="nav">

    <a
        href="index.html"
        class="logo"
    >
        PERSIAN <span>STARK</span>
    </a>


    <div class="nav-actions">

        <button
            class="nav-btn"
            id="themeBtn"
            onclick="toggleTheme()"
        >
            🌙
        </button>

        <button
            class="nav-btn"
            onclick="goHome()"
            title="خانه"
        >
            🏠
        </button>

    </div>

</nav>

</header>


<main class="page">


<a
    href="index.html"
    class="back"
>
    ← بازگشت به سایت
</a>


<div id="articleLoading" class="loading">

    در حال دریافت مطلب...

</div>


<div
    id="articleArea"
    style="display:none;"
>


<div class="article-layout">


<article class="article">


    <div class="article-head">

        <span
            id="articleCategory"
            class="category"
        ></span>

        <h1 id="articleTitle"></h1>

        <div
            id="articleDescription"
            class="description"
        ></div>

        <div
            id="articleMeta"
            class="meta"
        ></div>

    </div>


    <img
        id="articleCover"
        class="cover"
        style="display:none;"
        alt=""
    >


    <div
        id="articleContent"
        class="article-content"
    ></div>


</article>


<aside class="sidebar">


<div class="side-box">

    <div class="side-title">
        آخرین مطالب
    </div>

    <div id="latestPosts">

        <div class="loading">
            در حال دریافت...
        </div>

    </div>

</div>


<div class="side-box">

    <div class="side-title">
        PERSIAN STARK
    </div>

    <p
        style="
        color:var(--muted);
        font-size:13px;
        line-height:2;
        "
    >
        اخبار گیم، معرفی بازی و
        نرم‌افزارهای کاربردی.
    </p>

</div>


</aside>


</div>


<!-- COMMENTS -->

<section class="comments">


<div class="comments-title">
    نظرات کاربران
</div>

<div class="comments-sub">
    نظر خودت درباره این مطلب رو با ما به اشتراک بذار.
</div>


<div
    id="commentLogin"
    class="comment-login"
>

    برای ثبت نظر باید وارد حساب کاربری خودت بشی.

    <br>

    <button onclick="openLoginPage()">
        ورود / ثبت‌نام
    </button>

</div>


<form
    id="commentForm"
    class="comment-form"
    onsubmit="submitComment(event)"
>

    <textarea
        id="commentText"
        maxlength="2000"
        placeholder="نظرت رو بنویس..."
        required
    ></textarea>

    <button
        type="submit"
        class="comment-submit"
    >
        ثبت نظر
    </button>

</form>


<div id="commentsList">

    <div class="loading">
        در حال دریافت نظرات...
    </div>

</div>


</section>


</div>


</main>


<script>


/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://jmdoxofcyoxdrtxvvuiu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NqGaaVTBkzHUdCsWyWLXSA_dBqD_Q74";

const {
    createClient
} = supabase;

const db =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true,
            storageKey:"persian-stark-auth"
        }
    }
);


/* ================= POST ID ================= */

const params =
new URLSearchParams(
    location.search
);

const postId =
params.get("id");


/* ================= HELPERS ================= */

function escapeHTML(value=""){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


function categoryName(category){

    const names = {

        news:"اخبار گیم",

        game:"معرفی بازی",

        software:"نرم‌افزار",

        store:"فروشگاه CS2"

    };

    return names[category]
        || "PERSIAN STARK";

}


function formatDate(date){

    try{

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year:"numeric",
                month:"long",
                day:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        ).format(
            new Date(date)
        );

    }catch(e){

        return "";

    }

}


/* ================= THEME ================= */

function applyTheme(theme){

    if(theme === "light"){

        document.documentElement
            .classList
            .add("light");

        document.getElementById(
            "themeBtn"
        ).textContent = "☀️";

    }else{

        document.documentElement
            .classList
            .remove("light");

        document.getElementById(
            "themeBtn"
        ).textContent = "🌙";

    }

    localStorage.setItem(
        "ps-theme",
        theme
    );

}


function toggleTheme(){

    const light =
        document.documentElement
            .classList
            .contains("light");

    applyTheme(
        light
            ? "dark"
            : "light"
    );

}


applyTheme(
    localStorage.getItem(
        "ps-theme"
    ) || "dark"
);


/* ================= LOAD ARTICLE ================= */

async function loadArticle(){

    if(!postId){

        document.getElementById(
            "articleLoading"
        ).textContent =
            "شناسه مطلب پیدا نشد.";

        return;

    }


    const {
        data:post,
        error
    } = await db

        .from("posts")

        .select("*")

        .eq("id",postId)

        .single();


    if(error || !post){

        console.error(error);

        document.getElementById(
            "articleLoading"
        ).textContent =
            "این مطلب پیدا نشد.";

        return;

    }


    document.title =
        post.title +
        " | PERSIAN STARK";


    document.getElementById(
        "articleCategory"
    ).textContent =
        categoryName(
            post.category
        );


    document.getElementById(
        "articleTitle"
    ).textContent =
        post.title ||
        "بدون عنوان";


    document.getElementById(
        "articleDescription"
    ).textContent =
        post.description ||
        "";


    document.getElementById(
        "articleMeta"
    ).textContent =
        formatDate(
            post.created_at
        );


    if(post.image_url){

        const cover =
            document.getElementById(
                "articleCover"
            );

        cover.src =
            post.image_url;

        cover.alt =
            post.title || "";

        cover.style.display =
            "block";

    }


    const content =
        document.getElementById(
            "articleContent"
        );


    if(post.content){

        content.innerHTML =
            formatContent(
                post.content
            );

    }


    await loadBlocks();

    document.getElementById(
        "articleLoading"
    ).style.display =
        "none";


    document.getElementById(
        "articleArea"
    ).style.display =
        "block";


    loadLatest();

    updateCommentUI();

    loadComments();

}


/* ================= CONTENT ================= */

function formatContent(text){

    const safe =
        escapeHTML(text);


    return safe
        .split(/\n\s*\n/)
        .map(
            p =>
            `<p>${p.replace(/\n/g,"<br>")}</p>`
        )
        .join("");

}


/* ================= BLOCKS ================= */

async function loadBlocks(){

    const {
        data,
        error
    } = await db

        .from("post_blocks")

        .select("*")

        .eq(
            "post_id",
            postId
        )

        .order(
            "sort_order",
            {
                ascending:true
            }
        );


    if(error){

        console.log(
            "No blocks:",
            error
        );

        return;

    }


    if(!data?.length)
        return;


    const content =
        document.getElementById(
            "articleContent"
        );


    data.forEach(
        block => {

            if(block.type === "text"){

                const p =
                    document.createElement(
                        "p"
                    );

                p.innerHTML =
                    escapeHTML(
                        block.content
                    )
                    .replace(
                        /\n/g,
                        "<br>"
                    );

                content.appendChild(p);

            }


            if(block.type === "image"){

                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    block.content;

                img.loading =
                    "lazy";

                content.appendChild(img);

            }


            if(block.type === "video"){

                const iframe =
                    document.createElement(
                        "iframe"
                    );

                iframe.src =
                    youtubeEmbed(
                        block.content
                    );

                iframe.allow =
                    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";

                iframe.allowFullscreen =
                    true;

                content.appendChild(
                    iframe
                );

            }

        }
    );

}


/* ================= YOUTUBE ================= */

function youtubeEmbed(url){

    try{

        const parsed =
            new URL(url);


        if(
            parsed.hostname.includes(
                "youtu.be"
            )
        ){

            return "https://www.youtube.com/embed/" +
                parsed.pathname.slice(1);

        }


        const id =
            parsed.searchParams.get(
                "v"
            );


        if(id){

            return "https://www.youtube.com/embed/" +
                id;

        }


        return url;

    }catch(e){

        return url;

    }

}


/* ================= LATEST ================= */

async function loadLatest(){

    const box =
        document.getElementById(
            "latestPosts"
        );


    const {
        data,
        error
    } = await db

        .from("posts")

        .select(
            "id,title,created_at"
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        )

        .limit(6);


    if(error){

        box.innerHTML =
            "خطا در دریافت مطالب.";

        return;

    }


    if(!data?.length){

        box.innerHTML =
            "مطلبی وجود ندارد.";

        return;

    }


    box.innerHTML =
        data

            .filter(
                post =>
                String(post.id) !==
                String(postId)
            )

            .map(
                post => `

                <a
                    class="side-post"
                    href="article.html?id=${encodeURIComponent(post.id)}"
                >

                    ${escapeHTML(
                        post.title
                    )}

                </a>

                `
            )

            .join("");

}


/* ================= COMMENT UI ================= */

async function updateCommentUI(){

    const {
        data
    } = await db.auth.getSession();


    const loginBox =
        document.getElementById(
            "commentLogin"
        );

    const form =
        document.getElementById(
            "commentForm"
        );


    if(data.session){

        loginBox.style.display =
            "none";

        form.classList.add(
            "show"
        );

    }else{

        loginBox.style.display =
            "block";

        form.classList.remove(
            "show"
        );

    }

}


/* ================= LOAD COMMENTS ================= */

async function loadComments(){

    const list =
        document.getElementById(
            "commentsList"
        );


    const {
        data,
        error
    } = await db

        .from("comments")

        .select(
            `
            id,
            user_id,
            content,
            created_at,
            profiles(
                username
            )
            `
        )

        .eq(
            "post_id",
            postId
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        list.innerHTML = `
            <div class="no-comments">
                بخش نظرات هنوز فعال نشده است.
            </div>
        `;

        return;

    }


    if(!data?.length){

        list.innerHTML = `
            <div class="no-comments">
                هنوز نظری ثبت نشده.
                اولین نفر باش که نظر میدهی ✨
            </div>
        `;

        return;

    }


    const {
        data:sessionData
    } = await db.auth.getSession();


    const currentUser =
        sessionData.session?.user;


    list.innerHTML =
        data

            .map(
                comment => {

                    const username =
                        comment.profiles
                            ?.username ||
                        "کاربر";


                    const canDelete =
                        currentUser &&
                        currentUser.id ===
                        comment.user_id;


                    return `

                    <div class="comment">

                        <div class="comment-head">

                            <div class="comment-user">
                                ${escapeHTML(
                                    username
                                )}
                            </div>

                            <div class="comment-date">
                                ${formatDate(
                                    comment.created_at
                                )}
                            </div>

                        </div>


                        <div class="comment-text">
                            ${escapeHTML(
                                comment.content
                            )}
                        </div>


                        ${
                            canDelete
                            ?
                            `
                            <button
                                class="delete-comment"
                                onclick="deleteComment(${comment.id})"
                            >
                                حذف نظر
                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                    `;

                }
            )

            .join("");

}


/* ================= SUBMIT COMMENT ================= */

async function submitComment(event){

    event.preventDefault();


    const {
        data:sessionData
    } = await db.auth.getSession();


    if(!sessionData.session){

        openLoginPage();

        return;

    }


    const textarea =
        document.getElementById(
            "commentText"
        );


    const content =
        textarea.value.trim();


    if(!content)
        return;


    const button =
        document.querySelector(
            ".comment-submit"
        );


    button.disabled =
        true;


    button.textContent =
        "در حال ثبت...";


    const {
        error
    } = await db

        .from("comments")

        .insert({

            post_id:postId,

            user_id:
                sessionData.session
                    .user.id,

            content

        });


    button.disabled =
        false;


    button.textContent =
        "ثبت نظر";


    if(error){

        console.error(error);

        alert(
            "ثبت نظر انجام نشد."
        );

        return;

    }


    textarea.value =
        "";


    loadComments();

}


/* ================= DELETE COMMENT ================= */

async function deleteComment(id){

    const yes =
        confirm(
            "این نظر حذف شود؟"
        );


    if(!yes)
        return;


    const {
        error
    } = await db

        .from("comments")

        .delete()

        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "حذف نظر انجام نشد."
        );

        return;

    }


    loadComments();

}
