<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>پروفایل من | PERSIAN STARK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07111f;
    --bg2:#0b1728;
    --card:rgba(12,27,45,.93);
    --card2:#102238;
    --text:#f5f9ff;
    --muted:#9eafc4;
    --line:rgba(255,255,255,.09);
    --accent:#00c8ff;
    --accent2:#18e0c1;
    --orange:#ff9d42;
    --danger:#ff5577;
    --header:rgba(5,14,26,.88);
    --shadow:0 20px 60px rgba(0,0,0,.30);
    --max:1180px;
}

html.light{
    --bg:#f3f7fb;
    --bg2:#eaf1f7;
    --card:#ffffff;
    --card2:#f7faff;
    --text:#132238;
    --muted:#607087;
    --line:rgba(19,34,56,.12);
    --accent:#008bc7;
    --accent2:#009e89;
    --orange:#e87516;
    --danger:#d93458;
    --header:rgba(255,255,255,.92);
    --shadow:0 18px 45px rgba(30,55,80,.12);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            rgba(3,5,16,.72),
            rgba(3,5,16,.88)
        ),
        url("./background.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    background-color:var(--bg);

    color:var(--text);
    transition:.3s ease;
}

html.light body{
    background:
        linear-gradient(
            rgba(243,247,251,.78),
            rgba(243,247,251,.92)
        ),
        url("./background.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    background:var(--header);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid var(--line);
}

.container{
    width:min(var(--max),calc(100% - 32px));
    margin:auto;
}

.nav{
    min-height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:20px;
    font-weight:900;
    white-space:nowrap;
}

.logo-mark{
    width:42px;
    height:42px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    color:#03121c;

    box-shadow:
        0 8px 25px rgba(0,200,255,.22);
}

.logo span{
    color:var(--accent);
}

.nav-links{
    display:flex;
    gap:7px;
}

.nav-link{
    padding:11px 14px;

    color:var(--muted);

    border-radius:11px;

    transition:.2s;
}

.nav-link:hover{
    background:var(--card2);
    color:var(--text);
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-btn{
    width:42px;
    height:42px;

    display:grid;
    place-items:center;

    border:1px solid var(--line);
    border-radius:12px;

    background:var(--card);
    color:var(--text);

    font-size:17px;

    transition:.2s;
}

.icon-btn:hover{
    transform:translateY(-2px);
    border-color:rgba(0,200,255,.4);
}

.back-btn{
    border:1px solid var(--line);

    background:var(--card);
    color:var(--text);

    padding:11px 15px;

    border-radius:12px;

    transition:.2s;
}

.back-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
}

/* ================= PAGE ================= */

.page{
    padding:55px 0 70px;
}

.page-title{
    margin-bottom:28px;
}

.page-title h1{
    font-size:34px;
    margin-bottom:8px;
}

.page-title p{
    color:var(--muted);
    font-size:14px;
}

/* ================= PROFILE LAYOUT ================= */

.profile-layout{
    display:grid;

    grid-template-columns:
        310px
        minmax(0,1fr);

    gap:22px;
}

/* ================= SIDEBAR ================= */

.profile-card{
    background:var(--card);

    border:1px solid var(--line);

    border-radius:23px;

    padding:25px;

    box-shadow:var(--shadow);

    height:max-content;
}

.avatar-wrap{
    display:flex;
    justify-content:center;

    margin-bottom:18px;
}

.avatar{
    width:105px;
    height:105px;

    border-radius:50%;

    display:grid;
    place-items:center;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    color:#03121c;

    font-size:39px;
    font-weight:900;

    box-shadow:
        0 12px 40px rgba(0,200,255,.20);
}

.profile-name{
    text-align:center;

    font-size:21px;
    font-weight:900;

    word-break:break-word;
}

.profile-email{
    text-align:center;

    color:var(--muted);

    font-size:12px;

    margin-top:7px;

    word-break:break-all;
}

.account-status{
    display:flex;
    justify-content:center;

    margin-top:16px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:7px;

    padding:7px 11px;

    border-radius:999px;

    background:rgba(24,224,193,.09);

    border:1px solid rgba(24,224,193,.15);

    color:var(--accent2);

    font-size:12px;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--accent2);

    box-shadow:
        0 0 10px var(--accent2);
}

.profile-menu{
    margin-top:25px;

    border-top:1px solid var(--line);

    padding-top:15px;
}

.menu-item{
    width:100%;

    border:0;

    background:transparent;

    color:var(--muted);

    padding:12px;

    border-radius:11px;

    text-align:right;

    margin-bottom:5px;

    transition:.2s;
}

.menu-item:hover{
    background:var(--card2);
    color:var(--text);
}

.menu-item.active{
    background:
        rgba(0,200,255,.09);

    color:var(--accent);
}

.menu-item.logout{
    color:var(--danger);
}

/* ================= MAIN CARD ================= */

.settings-card{
    background:var(--card);

    border:1px solid var(--line);

    border-radius:23px;

    box-shadow:var(--shadow);

    overflow:hidden;
}

.card-header{
    padding:25px 27px;

    border-bottom:1px solid var(--line);
}

.card-header h2{
    font-size:22px;
    margin-bottom:7px;
}

.card-header p{
    color:var(--muted);
    font-size:13px;
    line-height:1.8;
}

.form{
    padding:27px;
}

.field{
    margin-bottom:20px;
}

.field label{
    display:block;

    font-size:13px;

    color:var(--muted);

    margin-bottom:8px;
}

.input-wrap{
    position:relative;
}

.field input{
    width:100%;

    border:1px solid var(--line);

    background:var(--card2);

    color:var(--text);

    padding:14px;

    border-radius:13px;

    outline:none;

    font-size:14px;

    transition:.2s;
}

.field input:focus{
    border-color:var(--accent);

    box-shadow:
        0 0 0 3px rgba(0,200,255,.08);
}

.field input[readonly]{
    opacity:.75;
    cursor:not-allowed;
}

.field-help{
    margin-top:8px;

    color:var(--muted);

    font-size:11px;

    line-height:1.8;
}

/* ================= TRADE ================= */

.trade-box{
    border:1px solid rgba(0,200,255,.15);

    background:
        linear-gradient(
            135deg,
            rgba(0,200,255,.055),
            rgba(24,224,193,.035)
        );

    border-radius:17px;

    padding:18px;

    margin-top:8px;
}

.trade-title{
    display:flex;
    align-items:center;
    gap:9px;

    font-size:15px;
    font-weight:900;

    margin-bottom:7px;
}

.trade-description{
    color:var(--muted);

    font-size:12px;

    line-height:1.9;

    margin-bottom:14px;
}

.trade-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.trade-help,
.copy-btn{
    border-radius:11px;

    padding:10px 13px;

    font-size:12px;

    font-weight:800;
}

.trade-help{
    border:0;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    color:#03121c;
}

.copy-btn{
    border:1px solid var(--line);

    background:var(--card);

    color:var(--text);
}

.copy-btn:hover{
    border-color:var(--accent);
}

/* ================= SAVE ================= */

.form-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    border-top:1px solid var(--line);

    padding-top:22px;

    margin-top:5px;
}

.save-btn{
    border:0;

    padding:13px 23px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    color:#03121c;

    font-weight:900;

    min-width:150px;
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.save-status{
    color:var(--muted);
    font-size:12px;
}

/* ================= SECURITY ================= */

.security-section{
    margin-top:22px;
}

.security-grid{
    display:grid;
    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:12px;
}

.security-item{
    border:1px solid var(--line);

    background:var(--card2);

    border-radius:15px;

    padding:17px;
}

.security-item h3{
    font-size:14px;
    margin-bottom:7px;
}

.security-item p{
    color:var(--muted);

    font-size:11px;

    line-height:1.8;

    margin-bottom:13px;
}

.security-btn{
    border:1px solid var(--line);

    background:var(--card);

    color:var(--text);

    border-radius:10px;

    padding:9px 12px;

    font-size:11px;
}

.security-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
}

/* ================= LOADING ================= */

.loading-screen{
    min-height:70vh;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--muted);

    font-size:14px;
}

.spinner{
    width:25px;
    height:25px;

    border:3px solid var(--line);

    border-top-color:var(--accent);

    border-radius:50%;

    animation:spin .7s linear infinite;

    margin-left:10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ================= TOAST ================= */

.toast{
    position:fixed;

    right:25px;
    bottom:25px;

    z-index:5000;

    background:var(--card);

    border:1px solid var(--line);

    box-shadow:var(--shadow);

    color:var(--text);

    border-radius:13px;

    padding:13px 17px;

    max-width:350px;

    transform:translateY(120px);

    opacity:0;

    transition:.25s;

    font-size:13px;
}

.toast.show{
    transform:none;
    opacity:1;
}

.toast.error{
    border-color:rgba(255,85,119,.35);
}

.toast.success{
    border-color:rgba(24,224,193,.35);
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;

    z-index:4000;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.72);

    backdrop-filter:blur(8px);

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(430px,100%);

    background:var(--card);

    border:1px solid var(--line);

    border-radius:21px;

    padding:25px;

    box-shadow:0 30px 100px rgba(0,0,0,.45);
}

.modal-box h2{
    font-size:20px;
    margin-bottom:9px;
}

.modal-box p{
    color:var(--muted);

    font-size:12px;

    line-height:1.9;

    margin-bottom:18px;
}

.modal-actions{
    display:flex;
    gap:8px;
}

.modal-primary,
.modal-secondary{
    flex:1;

    padding:11px;

    border-radius:11px;
}

.modal-primary{
    border:0;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    color:#03121c;

    font-weight:900;
}

.modal-secondary{
    border:1px solid var(--line);

    background:var(--card2);

    color:var(--text);
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    .nav-links{
        display:none;
    }

    .profile-layout{
        grid-template-columns:1fr;
    }

    .profile-card{
        display:grid;

        grid-template-columns:
            120px
            1fr;

        gap:20px;

        align-items:center;
    }

    .avatar-wrap{
        grid-row:span 2;

        margin:0;
    }

    .profile-name,
    .profile-email,
    .account-status{
        text-align:right;
        justify-content:flex-start;
    }

    .profile-menu{
        grid-column:1/-1;
        margin-top:5px;
    }
}

@media(max-width:600px){

    .container{
        width:min(100% - 20px,var(--max));
    }

    .nav{
        min-height:68px;
    }

    .logo{
        font-size:16px;
    }

    .logo-mark{
        width:37px;
        height:37px;
    }

    .back-btn{
        padding:9px 11px;
        font-size:12px;
    }

    .page{
        padding:30px 0 50px;
    }

    .page-title h1{
        font-size:27px;
    }

    .profile-card{
        display:block;
    }

    .avatar-wrap{
        margin-bottom:15px;
    }

    .profile-name,
    .profile-email,
    .account-status{
        text-align:center;
        justify-content:center;
    }

    .form,
    .card-header{
        padding:20px;
    }

    .form-footer{
        align-items:stretch;
        flex-direction:column;
    }

    .save-btn{
        width:100%;
    }

    .security-grid{
        grid-template-columns:1fr;
    }

    .trade-actions{
        flex-direction:column;
    }

    .trade-help,
    .copy-btn{
        width:100%;
    }

    .toast{
        right:10px;
        left:10px;
        bottom:10px;
        max-width:none;
    }
}
</style>
</head>

<body>

<div class="container nav">

href="./index.html"
class="logo"
>
    <div class="logo-mark">🎮</div>

    <div>

    </div>
</a>


<div class="nav-links">

<a
href="./index.html"
class="nav-link"
>
خانه
</a>

<a
href="./index.html#posts"
class="nav-link"
>
مطالب
</a>

</div>


<div class="nav-actions">

<button
class="icon-btn"
id="themeBtn"
title="تغییر حالت"
>

href="./index.html"

>

</div>

</header>


<!-- ================= MAIN ================= -->

<main>

<div

>

در حال بارگذاری پروفایل...

</div>

<div
class="toast"
id="toast"
></div>


<!-- ================= PASSWORD MODAL ================= -->

<div
class="modal"
id="passwordModal"
>

<div class="modal-box">

<h2>
🔐 تغییر رمز عبور
</h2>

<p>
با تأیید این گزینه، یک لینک تغییر رمز
به ایمیل حساب شما ارسال خواهد شد.

انصراف

ارسال لینک

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const { createClient } = supabase;

const db = createClient(
    "https://jmdoxofcyoxdrtxvvuiu.supabase.co",
    "sb_publishable_NqGaaVTBkzHUdCsWyWLXSA_dBqD_Q74",
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true,
            storageKey:"persian-stark-auth"
        }
    }
);


/* =========================================================
   GLOBALS
========================================================= */

let currentUser = null;
let currentProfile = null;

const page =
    document.getElementById("page");

const themeBtn =
    document.getElementById("themeBtn");

const toast =
    document.getElementById("toast");

const passwordModal =
    document.getElementById("passwordModal");

const cancelPassword =
    document.getElementById("cancelPassword");

const confirmPassword =
    document.getElementById("confirmPassword");


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(
    message,
    type="success"
){

    clearTimeout(toastTimer);

    toast.textContent =
        message;

    toast.className =
        "toast show " + type;

    toastTimer =
        setTimeout(()=>{
            toast.className =
                "toast";
        },3500);
}


/* =========================================================
   THEME
========================================================= */

function applyTheme(theme){

    if(theme === "light"){

        document.documentElement
            .classList.add("light");

        themeBtn.textContent =
            "🌙";

    }else{

        document.documentElement
            .classList.remove("light");

        themeBtn.textContent =
            "☀️";
    }
}


const savedTheme =
    localStorage.getItem(
        "persian-stark-theme"
    ) || "dark";

applyTheme(savedTheme);


themeBtn.addEventListener(
    "click",
    ()=>{

        const isLight =
            document.documentElement
                .classList.contains("light");

        const newTheme =
            isLight
                ? "dark"
                : "light";

        localStorage.setItem(
            "persian-stark-theme",
            newTheme
        );

        applyTheme(newTheme);
    }
);


/* =========================================================
   LOAD USER
========================================================= */

async function loadUser(){

    const {
        data,
        error
    } = await db.auth.getSession();

    if(error){

        console.error(error);

        redirectHome();

        return;
    }


    currentUser =
        data?.session?.user || null;


    if(!currentUser){

        redirectHome();

        return;
    }


    await loadProfile();
}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

    const {
        data,
        error
    } = await db
        .from("profiles")
        .select(
            "id,username,steam_trade_url,created_at,updated_at"
        )
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(error){

        console.error(error);

        showToast(
            "دریافت اطلاعات پروفایل با خطا مواجه شد.",
            "error"
        );
    }


    currentProfile =
        data || null;


    renderProfile();
}


/* =========================================================
   RENDER PROFILE
========================================================= */

function renderProfile(){

    const email =
        currentUser.email || "";


    const username =
        currentProfile?.username?.trim() ||
        email.split("@")[0] ||
        "کاربر";


    const tradeUrl =
        currentProfile?.steam_trade_url ||
        "";


    const initial =
        username
            .charAt(0)
            .toUpperCase();


    const createdDate =
        currentProfile?.created_at
            ? new Date(
                currentProfile.created_at
            ).toLocaleDateString(
                "fa-IR"
            )
            : "—";


    page.innerHTML = `

        <div class="page-title">

            <h1>
                👤 پروفایل من
            </h1>

            <p>
                اطلاعات حساب و تنظیمات شخصی خودت را مدیریت کن.
            </p>

        </div>


        <div class="profile-layout">


            <!-- SIDEBAR -->

            <aside class="profile-card">

                <div class="avatar-wrap">

                    <div class="avatar">
                        ${escapeHtml(initial)}
                    </div>

                </div>


                <div>

                    <div class="profile-name">
                        ${escapeHtml(username)}
                    </div>

                    <div class="profile-email">
                        ${escapeHtml(email)}
                    </div>


                    <div class="account-status">

                        <div class="status">

                            <span class="status-dot"></span>

                            حساب فعال

                        </div>

                    </div>

                </div>


                <div class="profile-menu">

                    <button
                        class="menu-item active"
                        type="button"
                    >
                        👤 اطلاعات پروفایل
                    </button>


                    <button
                        class="menu-item"
                        id="securityMenu"
                        type="button"
                    >
                        🔐 امنیت حساب
                    </button>


                    <button
                        class="menu-item logout"
                        id="logoutProfile"
                        type="button"
                    >
                        🚪 خروج از حساب
                    </button>

                </div>

            </aside>


            <!-- MAIN -->

            <section>

                <div class="settings-card">

                    <div class="card-header">

                        <h2>
                            اطلاعات حساب
                        </h2>

                        <p>
                            اطلاعات زیر مربوط به حساب فعلی شماست.
                            ایمیل حساب قابل تغییر مستقیم نیست.
                        </p>

                    </div>


                    <form
                        class="form"
                        id="profileForm"
                    >


                        <div class="field">

                            <label>
                                نام کاربری
                            </label>

                            <input
                                type="text"
                                id="usernameInput"
                                value="${escapeHtml(username)}"
                                maxlength="40"
                                placeholder="نام کاربری"
                                autocomplete="nickname"
                            >

                            <div class="field-help">
                                این نام کنار نظرات شما در مطالب سایت نمایش داده می‌شود.
                            </div>

                        </div>


                        <div class="field">

                            <label>
                                ایمیل حساب
                            </label>

                            <input
                                type="email"
                                value="${escapeHtml(email)}"
                                readonly
                            >

                        </div>


                        <div class="field">

                            <label>
                                Steam Trade Link
                            </label>


                            <div class="trade-box">

                                <div class="trade-title">
                                    🎮 اتصال حساب Steam
                                </div>


                                <div class="trade-description">
                                    لینک Trade استیم خودت را اینجا قرار بده تا
                                    برای استفاده‌های بعدی در پروفایلت ذخیره شود.
                                </div>


                                <input
                                    type="url"
                                    id="tradeInput"
                                    value="${escapeHtml(tradeUrl)}"
                                    placeholder="https://steamcommunity.com/tradeoffer/new/?partner=..."
                                >


                                <div class="trade-actions">

                                    <a
                                        href="https://steamcommunity.com/my/tradeoffers/privacy"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="trade-help"
                                    >
                                        🔗 پیدا کردن Trade Link
                                    </a>


                                    <button
                                        type="button"
                                        class="copy-btn"
                                        id="copyTradeBtn"
                                    >
                                        📋 کپی لینک
                                    </button>

                                </div>

                            </div>


                            <div class="field-help">
                                اگر Trade Link نداری، روی «پیدا کردن Trade Link» بزن.
                                صفحه مربوط به Steam باز می‌شود و می‌توانی لینک خودت را کپی کنی.
                            </div>

                        </div>


                        <div class="form-footer">

                            <div
                                class="save-status"
                                id="saveStatus"
                            >
                                آخرین بروزرسانی:
                                ${currentProfile?.updated_at
                                    ? new Date(
                                        currentProfile.updated_at
                                      ).toLocaleString("fa-IR")
                                    : "هنوز ذخیره نشده"}
                            </div>


                            <button
                                type="submit"
                                class="save-btn"
                                id="saveBtn"
                            >
                                💾 ذخیره تغییرات
                            </button>

                        </div>

                    </form>

                </div>


                <!-- SECURITY -->

                <div
                    class="settings-card security-section"
                    id="securitySection"
                >

                    <div class="card-header">

                        <h2>
                            🔐 امنیت حساب
                        </h2>

                        <p>
                            گزینه‌های مربوط به امنیت حساب کاربری.
                        </p>

                    </div>


                    <div class="form">

                        <div class="security-grid">

                            <div class="security-item">

                                <h3>
                                    تغییر رمز عبور
                                </h3>

                                <p>
                                    لینک تغییر رمز عبور به ایمیل حساب شما ارسال می‌شود.
                                </p>

                                <button
                                    class="security-btn"
                                    id="changePasswordBtn"
                                    type="button"
                                >
                                    ارسال لینک تغییر رمز
                                </button>

                            </div>


                            <div class="security-item">

                                <h3>
                                    وضعیت ایمیل
                                </h3>

                                <p>
                                    ایمیل حساب:
                                    ${currentUser.email_confirmed_at
                                        ? "تأیید شده"
                                        : "هنوز تأیید نشده"}
                                </p>

                                <span
                                    class="status"
                                    style="
                                        font-size:10px;
                                        display:inline-flex;
                                    "
                                >
                                    ${
                                        currentUser.email_confirmed_at
                                        ? "✓ تأیید شده"
                                        : "⚠ نیاز به تأیید"
                                    }
                                </span>

                            </div>

                        </div>

                    </div>

                </div>

            </section>

        </div>
    `;


    bindProfileEvents();
}


/* =========================================================
   PROFILE EVENTS
========================================================= */

function bindProfileEvents(){

    const form =
        document.getElementById(
            "profileForm"
        );

    const usernameInput =
        document.getElementById(
            "usernameInput"
        );

    const tradeInput =
        document.getElementById(
            "tradeInput"
        );

    const copyTradeBtn =
        document.getElementById(
            "copyTradeBtn"
        );

    const saveBtn =
        document.getElementById(
            "saveBtn"
        );

    const logoutProfile =
        document.getElementById(
            "logoutProfile"
        );

    const securityMenu =
        document.getElementById(
            "securityMenu"
        );

    const changePasswordBtn =
        document.getElementById(
            "changePasswordBtn"
        );


    /* SAVE */

    form.addEventListener(
        "submit",
        async e=>{

            e.preventDefault();


            const username =
                usernameInput.value.trim();

            const tradeUrl =
                tradeInput.value.trim();


            if(username.length < 3){

                showToast(
                    "نام کاربری باید حداقل ۳ کاراکتر باشد.",
                    "error"
                );

                usernameInput.focus();

                return;
            }


            if(username.length > 40){

                showToast(
                    "نام کاربری بیش از حد طولانی است.",
                    "error"
                );

                return;
            }


            if(
                tradeUrl &&
                !isValidSteamTradeUrl(tradeUrl)
            ){

                showToast(
                    "Steam Trade Link واردشده معتبر نیست.",
                    "error"
                );

                tradeInput.focus();

                return;
            }


            saveBtn.disabled =
                true;

            saveBtn.textContent =
                "در حال ذخیره...";


            try{

                const {
                    data,
                    error
                } = await db
                    .from("profiles")
                    .upsert({

                        id:currentUser.id,

                        username:username,

                        steam_trade_url:
                            tradeUrl || null,

                        updated_at:
                            new Date().toISOString()

                    },{
                        onConflict:"id"
                    })
                    .select()
                    .single();


                if(error)
                    throw error;


                currentProfile =
                    data;


                showToast(
                    "اطلاعات پروفایل با موفقیت ذخیره شد."
                );


                renderProfile();


            }catch(error){

                console.error(error);

                showToast(
                    error.message ||
                    "ذخیره اطلاعات انجام نشد.",
                    "error"
                );

            }finally{

                saveBtn.disabled =
                    false;

                saveBtn.textContent =
                    "💾 ذخیره تغییرات";
            }

        }
    );


    /* COPY */

    copyTradeBtn.addEventListener(
        "click",
        async ()=>{

            const value =
                tradeInput.value.trim();


            if(!value){

                showToast(
                    "ابتدا Trade Link را وارد کنید.",
                    "error"
                );

                return;
            }


            try{

                await navigator.clipboard.writeText(
                    value
                );

                showToast(
                    "Trade Link کپی شد 📋"
                );

            }catch(error){

                tradeInput.select();

                document.execCommand(
                    "copy"
                );

                showToast(
                    "Trade Link کپی شد 📋"
                );
            }
        }
    );


    /* LOGOUT */

    logoutProfile.addEventListener(
        "click",
        async ()=>{

            const {
                error
            } = await db.auth.signOut();


            if(error){

                showToast(
                    "خروج از حساب انجام نشد.",
                    "error"
                );

                return;
            }


            location.href =
                "./index.html";
        }
    );


    /* SECURITY SCROLL */

    securityMenu.addEventListener(
        "click",
        ()=>{

            document
                .getElementById(
                    "securitySection"
                )
                .scrollIntoView({
                    behavior:"smooth"
                });
        }
    );


    /* PASSWORD */

    changePasswordBtn.addEventListener(
        "click",
        ()=>{
            passwordModal.classList.add(
                "show"
            );
        }
    );
}


/* =========================================================
   PASSWORD RESET
========================================================= */

cancelPassword.addEventListener(
    "click",
    ()=>{
        passwordModal.classList.remove(
            "show"
        );
    }
);


passwordModal.addEventListener(
    "click",
    e=>{

        if(e.target === passwordModal){

            passwordModal.classList.remove(
                "show"
            );
        }
    }
);


confirmPassword.addEventListener(
    "click",
    async ()=>{

        confirmPassword.disabled =
            true;

        confirmPassword.textContent =
            "در حال ارسال...";


        try{

            const {
                error
            } = await db
                .auth
                .resetPasswordForEmail(
                    currentUser.email,
                    {
                        redirectTo:
                            window.location.origin +
                            "/profile.html"
                    }
                );


            if(error)
                throw error;


            passwordModal.classList.remove(
                "show"
            );


            showToast(
                "لینک تغییر رمز به ایمیل شما ارسال شد."
            );

        }catch(error){

            console.error(error);

            showToast(
                error.message ||
                "ارسال لینک انجام نشد.",
                "error"
            );

        }finally{

            confirmPassword.disabled =
                false;

            confirmPassword.textContent =
                "ارسال لینک";
        }
    }
);


/* =========================================================
   VALIDATE STEAM TRADE URL
========================================================= */

function isValidSteamTradeUrl(url){

    try{

        const parsed =
            new URL(url);


        return (
            parsed.protocol === "https:" &&
            parsed.hostname ===
                "steamcommunity.com" &&
            parsed.pathname.startsWith(
                "/tradeoffer/"
            )
        );

    }catch(error){

        return false;
    }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   REDIRECT
========================================================= */

function redirectHome(){

    showToast(
        "برای مشاهده پروفایل ابتدا وارد حساب شوید.",
        "error"
    );

    setTimeout(()=>{
        location.href =
            "./index.html";
    },900);
}


/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
    (event,session)=>{

        if(!session){

            location.href =
                "./index.html";
        }
    }
);


/* =========================================================
   START
========================================================= */

loadUser();

</script>

</html>
